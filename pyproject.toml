[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-manager-job-bot"
version = "0.1.0"
description = "Telegram aggregator for Project Manager vacancies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
pm-job-bot = "job_bot.app:run"

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["job_bot"]
